
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Navigation Menu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html{
    scroll-behavior:smooth;
}

/* Navigation Bar */
nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:transparent;
    transition:0.4s;
    z-index:1000;
}

nav.scrolled{
    background:#0d6efd;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:20px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    font-size:18px;
    transition:0.3s;
    padding:8px 12px;
    border-radius:5px;
}

/* Hover Effect */
nav ul li a:hover{
    background:white;
    color:#0d6efd;
}

/* Sections */
section{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    color:white;
}

#home{background:#6c63ff;}
#about{background:#20c997;}
#services{background:#fd7e14;}
#contact{background:#dc3545;}
</style>

</head>
<body>

<nav id="navbar">
    <div class="logo">My Website</div>

    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>

<section id="home">
    Home Section
</section>

<section id="about">
    About Section
</section>

<section id="services">
    Services Section
</section>

<section id="contact">
    Contact Section
</section>

<script>
const navbar = document.getElementById("navbar");

window.addEventListener("scroll", function () {
    if (window.scrollY > 50) {
        navbar.classList.add("scrolled");
    } else {
        navbar.classList.remove("scrolled");
    }
});
</script>

</body>
</html>
